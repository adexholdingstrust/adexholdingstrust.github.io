# Isolated Adex monitoring Worker. Never deploy under another organization's account.
name = "adex-hoa-monitor"
main = "index.js"
compatibility_date = "2026-10-23"
account_id = "8956c5a630c91f81296ffb3e8f9a7532"
workers_dev = true

# Add the real dedicated namespace ID before deployment; do not use finance KV.
# [[kv_namespaces]]
# binding = "HOA_MONITOR_KV"
# id = "<dedicated namespace ID>"

# Securely provision HOA_INGEST_SECRET, BREVO_API_KEY, and a verified
# HOA_SENDER_EMAIL or EMAIL_FROM. No HOA portal credentials belong here.
[vars]
NOTIFICATIONS_ENABLED = "false"

# Evaluates stored observations; collectors run separately.
[triggers]
crons = ["15 14 * * *", "15 21 * * *"]
