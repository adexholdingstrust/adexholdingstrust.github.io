name: Inspect isolated finance integration access
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitoring/inspect-monitor-integration.mjs'
      - '.github/workflows/inspect-monitor-integration.yml'
permissions:
  contents: read
jobs:
  inspect:
    environment: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect existing access and route metadata without changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADEX_MONITOR_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node monitoring/inspect-monitor-integration.mjs
