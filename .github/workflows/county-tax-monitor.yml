name: County tax monitoring
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read and reconcile county records without sending to the Worker
        type: boolean
        default: true
  workflow_run:
    workflows: [Deploy isolated Adex monitor]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '45 13,20 * * *'
permissions:
  contents: read
concurrency:
  group: adex-county-tax-monitor
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        county: [elko, nye, valencia, navajo, apache, iron, lancaster]
    name: ${{ matrix.county }} tax monitoring
    environment: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extraction
        if: matrix.county == 'elko' || matrix.county == 'nye' || matrix.county == 'apache'
        timeout-minutes: 3
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo apt-get install -y poppler-utils
          fi
      - name: Install Lancaster browser
        if: matrix.county == 'lancaster'
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Read county accounts and reconcile bills
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADEX_MONITOR_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ADEX_MONITOR_URL: ${{ vars.ADEX_MONITOR_URL }}
          ADEX_MONITOR_INGEST_SECRET: ${{ secrets.ADEX_MONITOR_INGEST_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python monitoring/collect-county-tax.py --county "${{ matrix.county }}" --dry-run
          else
            python monitoring/collect-county-tax.py --county "${{ matrix.county }}"
          fi
