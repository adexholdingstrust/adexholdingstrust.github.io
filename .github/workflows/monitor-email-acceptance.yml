name: Verify monitoring email delivery
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy isolated Adex monitor]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: adex-monitor-email-acceptance
  cancel-in-progress: false
jobs:
  verify-email:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify test-message safety
        run: python -m unittest discover -s monitoring -p 'test_email_acceptance.py'
      - name: Send monitoring test to both recipients
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADEX_MONITOR_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ADEX_MONITOR_INGEST_SECRET: ${{ secrets.ADEX_MONITOR_INGEST_SECRET }}
          ADEX_MONITOR_BREVO_API_KEY: ${{ secrets.ADEX_MONITOR_BREVO_API_KEY || secrets.BREVO_API_KEY }}
        run: python monitoring/verify-email-delivery.py
