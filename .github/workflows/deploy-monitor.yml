name: Deploy isolated Adex monitor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hoa-monitor-worker/**'
      - 'monitoring/deploy-monitor.py'
      - '.github/workflows/deploy-monitor.yml'
permissions:
  contents: read
concurrency:
  group: adex-isolated-monitor-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test monitoring/*.test.mjs hoa-monitor-worker/*.test.mjs
      - run: python -m unittest discover -s monitoring -p 'test_*.py'
      - name: Install county PDF extraction
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Deploy only adex-hoa-monitor and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADEX_MONITOR_CLOUDFLARE_API_TOKEN }}
          ADEX_MONITOR_INGEST_SECRET: ${{ secrets.ADEX_MONITOR_INGEST_SECRET }}
          ADEX_MONITOR_BREVO_API_KEY: ${{ secrets.ADEX_MONITOR_BREVO_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: python monitoring/deploy-monitor.py
