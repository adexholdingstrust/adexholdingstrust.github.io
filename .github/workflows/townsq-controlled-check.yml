name: TownSq controlled read-only check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/townsq-controlled-check.yml']
permissions:
  contents: read
concurrency:
  group: adex-townsq-controlled-check
  cancel-in-progress: false
jobs:
  verify:
    environment: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned portal client
        run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.64.1
      - name: Verify resident account retrieval and deliver validated observation
        env:
          HOA_PROVIDER: TOWNSQ
          HOA_TOWNSQ_ATTEMPT: 'true'
          HOA_INGEST_ENABLED: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADEX_MONITOR_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ADEX_MONITOR_INGEST_SECRET: ${{ secrets.ADEX_MONITOR_INGEST_SECRET }}
          ADEX_MONITOR_TOWNSQ_USERNAME: ${{ secrets.ADEX_MONITOR_TOWNSQ_USERNAME }}
          ADEX_MONITOR_TOWNSQ_PASSWORD: ${{ secrets.ADEX_MONITOR_TOWNSQ_PASSWORD }}
        run: node monitoring/hoa-auth-check.mjs
