name: Lancaster retrieval dry run
on:
  pull_request:
    paths:
      - 'monitoring/lancaster-tax-bill.py'
      - 'monitoring/collect-county-tax.py'
      - '.github/workflows/lancaster-dry-run.yml'
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - run: python monitoring/collect-county-tax.py --county lancaster --dry-run
