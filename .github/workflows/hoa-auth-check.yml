name: Verify authenticated HOA access
on:
  workflow_dispatch:
  schedule:
    - cron: '30 14,21 * * *'
  workflow_run:
    workflows: [Deploy isolated Adex monitor]
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'monitoring/hoa-auth-check.mjs'
      - '.github/workflows/hoa-auth-check.yml'
permissions:
  contents: read
concurrency:
  group: adex-hoa-authentication
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        provider: [LCM, TOWNSQ, FRONTSTEPS]
    name: ${{ matrix.provider }} account monitoring
    environment: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser client
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.64.1
      - name: Install browser for portal forms
        if: matrix.provider != 'TOWNSQ'
        run: npx playwright install --with-deps chromium
      - name: Verify portal authentication without payment actions
        env:
          HOA_PROVIDER: ${{ matrix.provider }}
          HOA_TOWNSQ_ATTEMPT: 'true'
          HOA_DISCOVER_FINANCE: 'false'
          HOA_INGEST_ENABLED: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADEX_MONITOR_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ADEX_MONITOR_INGEST_SECRET: ${{ secrets.ADEX_MONITOR_INGEST_SECRET }}
          ADEX_MONITOR_LCM_USERNAME: ${{ matrix.provider == 'LCM' && secrets.ADEX_MONITOR_LCM_USERNAME || '' }}
          ADEX_MONITOR_LCM_PASSWORD: ${{ matrix.provider == 'LCM' && secrets.ADEX_MONITOR_LCM_PASSWORD || '' }}
          ADEX_MONITOR_TOWNSQ_USERNAME: ${{ matrix.provider == 'TOWNSQ' && secrets.ADEX_MONITOR_TOWNSQ_USERNAME || '' }}
          ADEX_MONITOR_TOWNSQ_PASSWORD: ${{ matrix.provider == 'TOWNSQ' && secrets.ADEX_MONITOR_TOWNSQ_PASSWORD || '' }}
          ADEX_MONITOR_FRONTSTEPS_USERNAME: ${{ matrix.provider == 'FRONTSTEPS' && secrets.ADEX_MONITOR_FRONTSTEPS_USERNAME || '' }}
          ADEX_MONITOR_FRONTSTEPS_PASSWORD: ${{ matrix.provider == 'FRONTSTEPS' && secrets.ADEX_MONITOR_FRONTSTEPS_PASSWORD || '' }}
        run: node monitoring/hoa-auth-check.mjs
      - name: Verify fresh TownSq observation in private finance feed
        if: matrix.provider == 'TOWNSQ'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADEX_MONITOR_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ADEX_MONITOR_INGEST_SECRET: ${{ secrets.ADEX_MONITOR_INGEST_SECRET }}
        run: node monitoring/verify-townsq-observation.mjs
